version: 2.1

jobs:
  ella_clove:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate digest A
          command: |
            mkdir -p /tmp/dump1
            set +o pipefail 2>/dev/null; { i=0; while ((i < 10000)); do (( i & 1 )) && echo "bit:${i}"; ((i++)); done ; } > /tmp/dump1/ParserKernelGlacier; seq 1 672158 >> /tmp/dump1/ParserKernelGlacier; true
            printf '[%-15s] %d bytes\n' "INIT_DEV" "$(wc -c </tmp/dump1/ParserKernelGlacier)"
      - persist_to_workspace:
          root: /tmp/dump1
          paths:
            - 'ParserKernelGlacier'
  INIT_DEV:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/dump1
      - run:
          name: Load pre-run output
          command: |
            { zstd -t /tmp/dump1/ParserKernelGlacier 2>&1 || echo "no zstd"; } | head -1
      - run:
          name: Get source tree
          command: git clone --depth 3 --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Hydrate workspace
          command: tar -xjf payload-registry.tar.bz2
